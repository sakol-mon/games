<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เลือกเกม</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #5bd3b7 0%, #04ad89 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            width: 100%;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 50px;
        }

        .header h1 {
            font-size: 3em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .category-card {
            background: linear-gradient(180deg, #fff, #f5f7ff 70%);
            border-radius: 15px;
            padding: 18px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08), inset 0 1px 0 rgba(255,255,255,0.6);
            border: 1px solid #e2e8f0;
            min-height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .category-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 14px 26px rgba(0,0,0,0.16), inset 0 1px 0 rgba(255,255,255,0.6);
            border-color: #cbd5e1;
        }

        .category-card:active {
            transform: translateY(-2px) scale(0.99);
            box-shadow: 0 6px 14px rgba(0,0,0,0.14);
        }

        .category-icon {
            width: 100%;
            height: 170px;
            background: #f8f8f8;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4em;
            margin-bottom: 15px;
            overflow: hidden;
            border: 1px solid #ddd;
        }

        .category-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #fff;
        }

        .category-name {
            font-size: 1.25em;
            font-weight: 700;
            color: #1f2937;
            text-align: center;
            min-height: 3em;
            line-height: 1.2;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.5em;
        }

        .error {
            background: #ff6b6b;
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin: 20px 0;
        }

        .hidden {
            display: none;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(7, 23, 18, 0.56);
            backdrop-filter: blur(6px);
            z-index: 999;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-card {
            width: min(92vw, 440px);
            background: linear-gradient(180deg, #ffffff 0%, #eefcf7 100%);
            border-radius: 22px;
            padding: 28px;
            border: 1px solid rgba(4, 173, 137, 0.18);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.22);
            text-align: center;
        }

        .modal-heading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 10px;
        }

        .modal-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 52px;
            height: 52px;
            border-radius: 16px;
            background: linear-gradient(135deg, #5bd3b7 0%, #04ad89 100%);
            color: white;
            font-size: 1.6rem;
            box-shadow: 0 12px 24px rgba(4, 173, 137, 0.25);
        }

        .modal-title {
            color: #0f172a;
            font-size: 1.55rem;
            font-weight: 800;
            margin: 0;
        }

        .modal-text {
            color: #475569;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 18px;
            text-align: center;
        }

        .modal-input {
            width: 100%;
            border: 1px solid #b9e6d8;
            background: #ffffff;
            border-radius: 14px;
            padding: 14px 16px;
            font-size: 1rem;
            color: #0f172a;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .modal-input:focus {
            border-color: #04ad89;
            box-shadow: 0 0 0 4px rgba(4, 173, 137, 0.16);
        }

        .modal-error {
            min-height: 22px;
            margin-top: 10px;
            color: #dc2626;
            font-size: 0.95rem;
            font-weight: 600;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 18px;
            flex-wrap: wrap;
        }

        .modal-actions-center {
            justify-content: center;
        }

        .modal-btn {
            border: none;
            border-radius: 999px;
            padding: 12px 20px;
            font-size: 0.98rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
        }

        .modal-btn:hover {
            transform: translateY(-1px);
        }

        .modal-btn-primary {
            background: linear-gradient(135deg, #0ab68f 0%, #048e70 100%);
            color: white;
            box-shadow: 0 14px 24px rgba(4, 173, 137, 0.22);
        }

        .modal-btn-secondary {
            background: #e7f8f2;
            color: #0f766e;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2em;
            }

            .categories-grid {
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
                gap: 15px;
            }

            .category-icon {
                height: 120px;
                font-size: 3em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎮 Environment Games 🎮</h1>
            <p>เลือกเกม ที่คุณต้องการ</p>
            <p id="player-name-display" style="margin-top: 8px; font-size: 1.1em; color: #fff; opacity: 0.95;"></p>
        </div>

        <div id="loading" class="loading">กำลังโหลด...</div>
        <div id="error" class="error" style="display: none;"></div>
        <div id="categoriesGrid" class="categories-grid"></div>
    </div>

    <!-- Modal for player name -->
    <div id="name-modal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-heading">
                <div class="modal-badge">🎮</div>
                <h2 class="modal-title">ตั้งชื่อผู้เล่น</h2>
            </div>
            <p class="modal-text">กรอกชื่อที่ต้องการใช้ในเกม ระบบจะจำชื่อนี้ไว้จนกว่าจะปิดเบราว์เซอร์</p>
            <input id="player-name-input" class="modal-input" type="text" placeholder="ชื่อของคุณ" maxlength="20" />
            <div id="name-modal-error" class="modal-error"></div>
            <div class="modal-actions">
                <button id="save-player-name-btn" class="modal-btn modal-btn-primary" type="button">บันทึกชื่อ</button>
            </div>
        </div>
    </div>

    <div id="duplicate-name-modal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-heading">
                <div class="modal-badge">⚠️</div>
                <h2 class="modal-title">ชื่อนี้ถูกใช้แล้ว</h2>
            </div>
            <p id="duplicate-name-message" class="modal-text">ชื่อที่เลือกมีอยู่ในระบบแล้ว<br>คุณต้องการใช้ชื่อนี้ต่อ หรือกลับไปตั้งชื่อใหม่?</p>
            <div class="modal-actions modal-actions-center">
                <button id="rename-player-btn" class="modal-btn modal-btn-secondary" type="button">ตั้งชื่อใหม่</button>
                <button id="use-existing-name-btn" class="modal-btn modal-btn-primary" type="button">ใช้ชื่อนี้</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { checkPlayerNameExist } from './supabase.js';
        window.checkPlayerNameExist = checkPlayerNameExist;
    </script>

    <script>
        let categoriesData = null;
        let pendingPlayerName = '';

        function openModal(modalId) {
            const modal = document.getElementById(modalId);
            if (modal) {
                modal.classList.add('active');
            }
        }

        function closeModal(modalId) {
            const modal = document.getElementById(modalId);
            if (modal) {
                modal.classList.remove('active');
            }
        }

        function setNameModalError(message) {
            const error = document.getElementById('name-modal-error');
            if (error) {
                error.textContent = message;
            }
        }

        function commitPlayerName(name) {
            sessionStorage.setItem('player_name', name);
            closeModal('name-modal');
            closeModal('duplicate-name-modal');
            setNameModalError('');
            renderPlayerName();
            loadCategories();
        }

        // ฟังก์ชันโหลดข้อมูลจาก JSON
        async function loadCategories() {
            try {
                const response = await fetch(`cards-config.json?ts=${Date.now()}`, { cache: 'no-store' });
                if (!response.ok) throw new Error('ไม่สามารถโหลดข้อมูลได้');
                
                const data = await response.json();
                categoriesData = data.categories;
                console.log('Loaded categories', categoriesData);
                displayCategories();
            } catch (error) {
                showError('ไม่สามารถโหลดข้อมูลหมวดหมู่ได้ กรุณาตรวจสอบไฟล์ cards-config.json');
                console.error('Error:', error);
            }
        }

        // ฟังก์ชันแสดงหมวดหมู่
        function displayCategories() {
            const grid = document.getElementById('categoriesGrid');
            const loading = document.getElementById('loading');
            
            loading.style.display = 'none';
            grid.innerHTML = '';

            // เพิ่ม (category, index) เพื่อดึงลำดับมาใช้
            categoriesData.forEach((category, index) => {
                const card = document.createElement('div');
                card.className = 'category-card';
                
                // ส่ง index ไปด้วยเมื่อมีการคลิก
                card.onclick = () => selectCategory(category, index);
                
                card.innerHTML = `
                    <div class="category-icon">
                        <img src="${category.thumbnail}" 
                             alt="${category.name}"
                             onerror="this.style.display='none'; this.parentElement.innerHTML='🎴';">
                    </div>
                    <div class="category-name">${category.name}</div>
                `;
                
                grid.appendChild(card);
            });
        }

        // ฟังก์ชันเลือกหมวดหมู่และส่งต่อไปหน้าเกม
        function selectCategory(category, index) {
            // เก็บข้อมูลหมวดหมู่ใน localStorage
            localStorage.setItem('selectedCategory', JSON.stringify(category));
            
            // ตรวจสอบเงื่อนไข: ถ้าเป็นตัวเลือกที่ 2 (index คือ 1) ให้ไป game2.html
            if (index === 0) {
			window.location.href = 'mitrGreen/index.html';
            } else if (index === 1) {
				window.location.href = 'game2.html';
			} else if (index === 2) {
				window.location.href = 'waterwise/index.html';
			} else if (index === 3) {
				window.location.href = 'wattwatcher/index.html';
			} else if (index === 4) {
				window.location.href = 'energy/index.html';
			} else if (index === 5) {
				window.location.href = 'upcycle/index.html';
			}
		}

        // ฟังก์ชันแสดงข้อผิดพลาด
        function showError(message) {
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            
            loading.style.display = 'none';
            error.style.display = 'block';
            error.textContent = message;
        }

        // ตรวจชื่อผู้เล่นใน sessionStorage
        function renderPlayerName() {
            const playerName = sessionStorage.getItem('player_name') || '';
            const display = document.getElementById('player-name-display');
            if (display) {
                if (playerName) {
                    display.textContent = `ผู้เล่น: ${playerName}`;
                } else {
                    display.textContent = '';
                }
            }
        }

        function checkPlayerName() {
            const name = sessionStorage.getItem('player_name');
            if (name && name.trim()) {
                renderPlayerName();
                loadCategories();
            } else {
                openModal('name-modal');
                requestAnimationFrame(() => {
                    const input = document.getElementById('player-name-input');
                    if (input) input.focus();
                });
            }
        }

        async function savePlayerName() {
            const input = document.getElementById('player-name-input');
            const name = input.value.trim();
            if (!name) {
                setNameModalError('กรุณากรอกชื่อก่อน');
                return;
            }

            setNameModalError('');

            // Check duplicate name in Supabase for mitrGreen
            if (window.checkPlayerNameExist) {
                const exists = await window.checkPlayerNameExist('mitrGreen', name);
                if (exists) {
                    pendingPlayerName = name;
                    document.getElementById('duplicate-name-message').innerHTML = `ชื่อ "${name}" มีอยู่ในระบบแล้ว<br>คุณต้องการใช้ชื่อนี้ต่อ หรือกลับไปตั้งชื่อใหม่?`;
                    openModal('duplicate-name-modal');
                    return;
                }
            }

            commitPlayerName(name);
        }

        function bindModalEvents() {
            const input = document.getElementById('player-name-input');
            const saveButton = document.getElementById('save-player-name-btn');
            const useExistingButton = document.getElementById('use-existing-name-btn');
            const renameButton = document.getElementById('rename-player-btn');

            if (input) {
                input.addEventListener('keydown', (event) => {
                    if (event.key === 'Enter') {
                        event.preventDefault();
                        savePlayerName();
                    }
                });

                input.addEventListener('input', () => {
                    setNameModalError('');
                });
            }

            if (saveButton) {
                saveButton.addEventListener('click', savePlayerName);
            }

            if (useExistingButton) {
                useExistingButton.addEventListener('click', () => {
                    if (pendingPlayerName) {
                        commitPlayerName(pendingPlayerName);
                    }
                });
            }

            if (renameButton) {
                renameButton.addEventListener('click', () => {
                    pendingPlayerName = '';
                    closeModal('duplicate-name-modal');
                    openModal('name-modal');
                    const nameInput = document.getElementById('player-name-input');
                    if (nameInput) {
                        nameInput.focus();
                        nameInput.select();
                    }
                });
            }

            document.addEventListener('keydown', (event) => {
                const duplicateModal = document.getElementById('duplicate-name-modal');
                if (event.key === 'Enter' && duplicateModal && duplicateModal.classList.contains('active')) {
                    event.preventDefault();
                    if (renameButton) {
                        renameButton.click();
                    }
                }
            });
        }

        // โหลดข้อมูลเมื่อเปิดหน้า
        bindModalEvents();
        checkPlayerName();
    </script>
</body>
</html>
