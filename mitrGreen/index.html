<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกมจับคู่มิตร Green Thailand</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            padding: 15px 30px;
            border-radius: 15px;
            margin-bottom: 20px;
            color: white;
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.1rem;
        }

        .stat-value {
            font-weight: bold;
            font-size: 1.3rem;
        }

        .reset-btn {
            background: white;
            color: #667eea;
            border: none;
            padding: 10px 25px;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .reset-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .home-btn {
            position: fixed;
            top: 12px;
            right: 14px;
            z-index: 1000;
            border: none;
            border-radius: 999px;
            background: #fff;
            color: #2c3e50;
            font-size: 0.95rem;
            font-weight: 700;
            padding: 8px 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            cursor: pointer;
        }

        .home-btn:hover { transform: translateY(-1px); }

        #game-board {
            display: grid;
            grid-template-columns: repeat(6, minmax(0, 1fr));
            gap: 12px;
            padding: 18px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            justify-items: stretch;
        }

        .card {
            width: 100%;
            max-width: 180px;
        }

        .card {
            aspect-ratio: 3/4;
            position: relative;
            width: 100%;
            height: 100%;
            cursor: pointer;
            transition: box-shadow 0.25s ease;
            transform-style: preserve-3d;
            perspective: 1200px;
        }

        .card-inner {
            position: absolute;
            inset: 0;
            border-radius: 15px;
            transform-style: preserve-3d;
            transition: transform 0.35s ease;
            transform-origin: center center;
        }

        .card.flipped .card-inner,
        .card.matched .card-inner {
            transform: rotateY(180deg);
        }

        .card-back,
        .card-front {
            position: absolute;
            inset: 0;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            backface-visibility: hidden;
        }

        .card-back {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            background-image: url('images/cover.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 2;
        }

        .card-front {
            background: white;
            padding: 15px;
            width: 100%;
            height: 100%;
            overflow: hidden;
            transform: rotateY(180deg);
            z-index: 1;
        }

        .card.matched {
            opacity: 0.72;
            pointer-events: none;
        }

        .card-front img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 10px;
        }

        .card:hover {
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.25);
        }

        .card-text {
            text-align: center;
            width: 100%;
        }

        .thai-text {
            font-size: 1.3rem;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .english-text {
            font-size: 1rem;
            color: #666;
            font-style: italic;
        }

        /* Win Message Modal */
        #win-message {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .win-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-100px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .win-content h2 {
            color: #667eea;
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        .win-content p {
            font-size: 1.1rem;
            color: #444;
            margin-bottom: 10px;
        }

        .win-content input {
            width: 100%;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 8px;
            font-size: 0.95rem;
        }

        .win-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-top: 12px;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #333;
        }

        .btn:hover {
            transform: scale(1.05);
        }

        .leaderboard {
            margin-bottom: 20px;
            background: rgba(255,255,255,0.15);
            padding: 15px;
            border-radius: 15px;
            color: #fff;
            border: 1px solid rgba(255,255,255,0.3);
            backdrop-filter: blur(7px);
        }
        .leaderboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            gap: 10px;
        }
        .leaderboard h3 {
            margin: 0;
            font-size: 1.1rem;
        }
        .leaderboard-list {
            list-style: decimal inside;
            padding-left: 0;
            margin: 0;
            counter-reset: list;
        }
        .leaderboard {
            margin: 10px 0 20px;
            background: rgba(255,255,255,0.12);
            padding: 12px;
            border-radius: 12px;
            color: #fff;
            border: 1px solid rgba(255,255,255,0.24);
            backdrop-filter: blur(6px);
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
            font-size: 0.88rem;
        }
        .leaderboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            gap: 8px;
        }
        .leaderboard h3 {
            margin: 0;
            font-size: 1rem;
        }
        .leaderboard-list {
            margin: 0;
            padding: 0 0 0 18px;
            font-size: 0.9rem;
        }
        .leaderboard-list li {
            margin: 4px 0;
            padding: 6px 8px;
            border-radius: 8px;
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.2);
        }

        /* Inline Leaderboard View */
        #leaderboard-view {
            display: none;
        }

        .leaderboard-panel {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px 24px;
            color: white;
        }

        .leaderboard-panel h2 {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 6px;
        }

        .leaderboard-panel .lb-subtitle {
            text-align: center;
            opacity: 0.85;
            margin-bottom: 20px;
            font-size: 1rem;
        }

        .lb-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 24px;
        }

        .lb-table th,
        .lb-table td {
            padding: 12px 16px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .lb-table thead tr {
            background: rgba(255, 255, 255, 0.2);
            font-size: 1rem;
        }

        .lb-table tbody tr {
            transition: transform 0.4s ease, background 0.4s ease;
        }

        .lb-table tbody tr:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .lb-table tbody tr.new-row {
            animation: lb-highlight 1s ease;
        }

        @keyframes lb-highlight {
            0%   { background: rgba(34, 197, 94, 0.6); transform: scale(1.03); }
            100% { background: transparent; transform: scale(1); }
        }

        #lb-status {
            text-align: center;
            font-size: 0.85rem;
            opacity: 0.7;
            margin-bottom: 14px;
        }

        .lb-table .rank-1 { background: rgba(255, 215, 0, 0.25); }
        .lb-table .rank-2 { background: rgba(192, 192, 192, 0.25); }
        .lb-table .rank-3 { background: rgba(205, 127, 50, 0.25); }

        .lb-play-again {
            text-align: center;
            margin-top: 8px;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            #game-board {
                grid-template-columns: repeat(4, minmax(0, 1fr));
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            .stats-bar {
                flex-direction: column;
                gap: 15px;
            }

            #game-board {
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 10px;
                padding: 10px;
            }

            .thai-text {
                font-size: 1rem;
            }

            .english-text {
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <button class="home-btn" onclick="goHome()">🏠 Home</button>
    <div class="container">
        <header>
            <h1>🍃 เกมจับคู่มิตร Green Thailand 🍃</h1>
            <p class="subtitle">จับคู่ภาพเดียวกันให้ครบทุกคู่</p>
            <p id="player-name-display" style="margin-top: 8px; font-size: 1rem; color: white; opacity: 0.95;"></p>
        </header>

        <div id="game-zone">
            <div class="stats-bar">
                <div class="stat">
                    <span>⏱️ เวลา:</span>
                    <span class="stat-value" id="timer">00:00</span>
                </div>
                <div class="stat">
                    <span>🎯 จำนวนครั้ง:</span>
                    <span class="stat-value" id="moves">0</span>
                </div>
                <div class="stat">
                    <span>✅ คู่ที่จับได้:</span>
                    <span class="stat-value" id="pairs">0/6</span>
                </div>
                <button class="reset-btn" onclick="resetGame()">🔄 เริ่มใหม่</button>
            </div>

            <div id="game-board"></div>
        </div>

        <div id="leaderboard-view">
            <div class="leaderboard-panel">
                <h2>🏆 Leaderboard</h2>
                <p class="lb-subtitle">มิตร Green Thailand — Top 10</p>
                <div id="lb-status">กำลังโหลด...</div>
                <table class="lb-table">
                    <thead>
                        <tr>
                            <th>อันดับ</th>
                            <th>ชื่อ</th>
                            <th>ครั้ง</th>
                            <th>เวลา</th>
                            <th>วันที่</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard-list"></tbody>
                </table>
                <div class="lb-play-again">
                    <button class="reset-btn" onclick="playAgain()">🔄 เล่นอีกครั้ง</button>
                </div>
            </div>
        </div>

    </div>

    <!-- Win Message Modal -->
    <div id="win-message">
        <div class="win-content">
            <h2>🎉 ยินดีด้วย! 🎉</h2>
            <p>คุณจับคู่สำเร็จทั้งหมดใน <strong id="final-moves">0</strong> ครั้ง</p>
            <p>เวลา: <strong id="final-time">00:00</strong></p>
            <div class="win-buttons">
                <button class="btn btn-primary" onclick="confirmWinMessage()">ตกลง</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module">
        import { supabase, getLeaderboard, insertScore, subscribeLeaderboard } from '../config/supabase.js';
        window.supabase = supabase;
        window.getLeaderboard = getLeaderboard;
        window.insertScore = insertScore;
        window.subscribeLeaderboard = subscribeLeaderboard;
    </script>
    <script src="config/script.js"></script>
</body>
</html>
