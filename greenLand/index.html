<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Story Quiz Game (Low Carbon Trip)</title>
    <style>
        /* CSS หลักสำหรับ Body และ Background */
        body { 
            font-family: 'Arial', sans-serif; 
            text-align: center; 
            margin: 0; 
            padding: 0;
            
            background-color: #f4fff8;
            
            background-size: auto 100vh;
            background-position: center;  
            background-repeat: no-repeat; 
            background-attachment: fixed;
            transition: background-image 0.5s ease-in-out; 
            
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-end; 
        }
        
        /* สไตล์สำหรับกรอบข้อความหลักของเกม */
        .game-container { 
            width: 90%; 
            max-width: 700px;
            margin: 0 20px 20px 20px;
            padding: 15px 20px; 
            
            background-color: rgba(255, 255, 255, 0.92); 
            border-radius: 14px; 
            box-shadow: 0 12px 28px rgba(34, 197, 94, 0.12); 
            border: 1px solid #b7e4c7;
            text-align: left;
        }

        /* สไตล์สำหรับหัวข้อและคำถาม */
        h1 { text-align: center; margin-top: 0; color: #1f3b2d; font-size: 1.6em; }
        
        /* ขนาดตัวอักษรของคำถาม (1.2em) */
        #question { 
            font-size: 1.2em; 
            margin-bottom: 15px; 
            color: #1f3b2d; 
            text-align: center; 
            font-weight: bold; 
        }
        
        #score-display { 
            margin-top: 15px; 
            font-size: 1.1em; 
            font-weight: bold; 
            color: #15803d; 
            text-align: center;
        }

        /* *** สไตล์สำหรับตัวเลือก (2x2 Grid) *** */
        #options-container {
            display: flex;
            flex-wrap: wrap; 
            justify-content: center; 
            gap: 10px; 
            padding-bottom: 5px; 
        }

        .option-button { 
            width: 48%; 
            min-height: 70px; 
            box-sizing: border-box; 
            
            display: flex;
            align-items: center; 
            justify-content: center; 

            padding: 10px; 
            margin: 0; 
            
            font-size: 0.945em; 

            background: linear-gradient(135deg, #86efac, #7dd3fc); 
            color: #134e2d; 
            border: 2px solid #6ee7b7; 
            border-radius: 10px; 
            cursor: pointer; 
            text-align: center;
            transition: background-color 0.3s, transform 0.1s; 
            word-break: break-word; 
            font-weight: 700;
        }
        
        .option-button:hover { 
            background: linear-gradient(135deg, #4ade80, #38bdf8); 
            transform: scale(1.02);
        }

        .home-btn {
            position: fixed;
            top: 12px;
            right: 14px;
            z-index: 1000;
            border: 1px solid #b7e4c7;
            border-radius: 999px;
            background: linear-gradient(135deg, #ffffff, #dcfce7);
            color: #1f3b2d;
            font-size: 0.95rem;
            font-weight: 700;
            padding: 8px 14px;
            box-shadow: 0 6px 16px rgba(34,197,94,0.12);
            cursor: pointer;
        }

        .home-btn:hover { transform: translateY(-1px); }

    </style>
</head>
<body>
    <button class="home-btn" onclick="goHome()">🏠 Home</button>
    <div class="game-container">
        <h1>เกมเรื่องราว: ทริปกรีนแลนด์</h1>
        <p id="question">กำลังโหลดเนื้อเรื่อง...</p>
        <div id="options-container">
            </div>
        <div id="score-display">เตรียมพร้อมสำหรับการเดินทาง!</div>
    </div>

    <script src="config/script.js"></script>
</body>
</html>
