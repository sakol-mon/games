<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>♻️ เก็บขยะ!</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&family=Press+Start+2P&family=Sarabun:wght@400;700;800&display=swap');

  :root {
    --yellow:  #FFE082;
    --green:   #22C55E;
    --blue:    #38BDF8;
    --red:     #EF4444;
    --bg:      #F4FFF8;
    --panel:   rgba(255,255,255,.88);
    --border:  #B7E4C7;
    --text:    #1F3B2D;
    --dim:     #5F8F76;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: linear-gradient(135deg, #f8fffb 0%, #ebfff3 48%, #e0f7fa 100%);
    color: var(--text);
    font-family: 'Sarabun', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* Soft eco background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(circle at 12% 18%, rgba(34,197,94,.12) 0%, transparent 18%),
      radial-gradient(circle at 82% 15%, rgba(56,189,248,.14) 0%, transparent 20%),
      radial-gradient(circle at 20% 82%, rgba(255,224,130,.16) 0%, transparent 16%),
      radial-gradient(circle at 72% 72%, rgba(34,197,94,.08) 0%, transparent 22%),
      linear-gradient(180deg, rgba(255,255,255,.65), rgba(255,255,255,0));
    pointer-events: none;
    z-index: 0;
  }

  #wrapper {
    position: relative;
    z-index: 1;
    display: flex;
    gap: 20px;
    align-items: flex-start;
    padding: 18px;
  }

  /* ===== SIDE PANEL ===== */
  #side-panel {
    width: 200px;
    height: 700px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .panel-box {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    box-shadow: 0 10px 25px rgba(34,197,94,.08);
    backdrop-filter: blur(8px);
    overflow: visible;
  }

  .panel-title {
    font-family: 'Press Start 2P', monospace;
    font-size: 7px;
    color: var(--dim);
    letter-spacing: 2px;
    margin-bottom: 8px;
    text-transform: uppercase;
  }

  /* Score */
  #score-value {
    font-family: 'IBM Plex Mono', 'Courier New', monospace;
    font-size: 28px;
    font-weight: 700;
    color: var(--text);
    text-shadow: 0 0 14px rgba(56,189,248,.25);
    line-height: 1.2;
    letter-spacing: 2px;
  }

  #score-delta {
    font-size: 13px;
    font-weight: 700;
    height: 20px;
    margin-top: 6px;
    transition: opacity .3s;
  }
  #score-delta.pos { color: var(--green); }
  #score-delta.neg { color: var(--red); }

  /* Timer */
  #timer-value {
    font-family: 'IBM Plex Mono', 'Courier New', monospace;
    font-size: 26px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 2px;
  }
  #timer-bar-wrap {
    margin-top: 10px;
    height: 6px;
    background: rgba(95,143,118,.18);
    border-radius: 3px;
    overflow: hidden;
  }
  #timer-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--blue), var(--green));
    border-radius: 3px;
    transition: width .1s linear, background .5s;
    width: 100%;
  }

  /* Bin color indicator — main + preview overlay */
  #bin-color-indicator {
    position: relative;
    width: 100%;
    height: 50px;
    margin: -8px -14px 0 -14px;
    padding: 8px 14px 0 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: visible;
  }

  .bin-color-slot {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .bin-color-slot.current {
    width: 100%;
    height: 100%;
    justify-content: center;
  }

  .bin-color-slot.next {
    bottom: 2px;
    right: 2px;
    width: auto;
    height: auto;
  }

  .bin-color-label {
    display: none;
  }

  .bin-color-next-label {
    font-family: 'Press Start 2P', monospace;
    font-size: 7px;
    color: var(--dim);
    letter-spacing: 0.5px;
    text-align: center;
    line-height: 1;
    margin-bottom: 2px;
  }

  .bin-color-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .bin-color-slot.next .bin-color-content {
    gap: 3px;
  }

  #bin-swatch {
    width: 36px; height: 36px;
    border-radius: 8px;
    border: 2px solid rgba(31,59,45,.15);
    transition: background .4s, box-shadow .4s;
    box-shadow: 0 0 16px rgba(255,255,255,.4);
  }

  #bin-swatch-next {
    width: 18px; height: 18px;
    border-radius: 4px;
    border: 1px solid rgba(31,59,45,.2);
    transition: background .4s, box-shadow .4s;
    box-shadow: 0 0 6px rgba(255,255,255,.3);
  }

  .bin-color-info {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
  }

  #bin-color-name {
    font-weight: 800;
    font-size: 16px;
    transition: color .4s;
  }

  #bin-color-name-next {
    font-weight: 700;
    font-size: 9px;
    transition: color .4s;
    opacity: 0.8;
    display: none;
  }

  #bin-color-countdown {
    font-family: 'IBM Plex Mono', 'Courier New', monospace;
    font-size: 10px;
    font-weight: 700;
    color: var(--dim);
    white-space: nowrap;
    letter-spacing: 0.5px;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(255,255,255,0.9);
    padding: 1px 4px;
    border-radius: 3px;
    border: 1px solid var(--border);
  }

  /* ===== GAME CANVAS AREA ===== */
  #game-area {
    position: relative;
    width: 360px;
    height: 700px;
    background: linear-gradient(180deg, rgba(255,255,255,.98) 0%, rgba(236,255,243,.95) 100%);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 18px 40px rgba(34,197,94,.12);
  }

  /* Soft texture overlay */
  #game-area::after {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 4px,
      rgba(34,197,94,.03) 4px,
      rgba(34,197,94,.03) 5px
    );
    pointer-events: none;
    z-index: 50;
  }

  /* Ground line */
  #ground-line {
    position: absolute;
    bottom: 90px;
    left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--border), transparent);
  }

  /* Trash items */
  .trash {
    position: absolute;
    width: 44px; height: 44px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-family: 'Sarabun', sans-serif;
    box-shadow: 0 8px 16px rgba(31,59,45,.12), inset 0 0 8px rgba(255,255,255,.35);
    z-index: 10;
    animation: wobble 1.2s ease-in-out infinite alternate;
    cursor: default;
    user-select: none;
    overflow: hidden;
  }
  .trash-img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    pointer-events: none;
    user-select: none;
  }
  @keyframes wobble {
    from { transform: rotate(-6deg); }
    to   { transform: rotate(6deg); }
  }

  /* Score pop */
  .score-pop {
    position: absolute;
    font-family: 'IBM Plex Mono', 'Courier New', monospace;
    font-size: 13px;
    font-weight: 700;
    pointer-events: none;
    z-index: 60;
    animation: pop-up .8s ease-out forwards;
    letter-spacing: 1px;
  }
  @keyframes pop-up {
    0%   { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-60px) scale(1.3); }
  }

  /* Miss flash */
  .miss-flash {
    position: absolute;
    inset: 0;
    background: rgba(255,23,68,.18);
    z-index: 55;
    animation: flash-out .35s ease-out forwards;
    pointer-events: none;
  }
  @keyframes flash-out {
    from { opacity: 1; }
    to   { opacity: 0; }
  }

  /* BIN */
  #bin-wrap {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: none;
  }

  #bin-svg {
    width: 64px; height: 80px;
    filter: drop-shadow(0 0 10px var(--current-bin-color, #fff));
    transition: filter .4s;
  }

  /* ===== OVERLAY (start / gameover) ===== */
  #overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,.90), rgba(235,255,243,.94));
    backdrop-filter: blur(6px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding-top: 0;
    z-index: 100;
    gap: 18px;
    border-radius: 16px;
  }

  #overlay.upcycle-mode {
    position: relative;
    justify-content: flex-start;
    padding-top: 20px;
    padding-bottom: 0;
    gap: 8px;
  }

  #overlay.upcycle-mode .btn-action-group {
    margin-top: auto;
    margin-bottom: 28px;
  }

  #overlay h1 {
    font-family: 'Press Start 2P', monospace;
    font-size: 14px;
    text-align: center;
    line-height: 1.8;
    color: var(--text);
    text-shadow: 0 0 18px rgba(56,189,248,.28);
    margin-bottom: 2px;
  }

  #overlay .sub {
    font-size: 15px;
    color: #46705b;
    text-align: center;
    line-height: 1.4;
    margin-bottom: 4px;
  }

  #overlay .final-score {
    font-family: 'IBM Plex Mono', 'Courier New', monospace;
    font-size: 36px;
    font-weight: 700;
    color: #d97706;
    text-shadow: 0 0 14px rgba(255,224,130,.8);
    letter-spacing: 2px;
  }

  #btn-start {
    margin-top: 8px;
    padding: 9px 12px;
    background: linear-gradient(135deg, #7dd3fc, #86efac);
    border: none;
    border-radius: 10px;
    color: #134e2d;
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    cursor: pointer;
    letter-spacing: 0.5px;
    box-shadow: 0 8px 22px rgba(56,189,248,.28);
    transition: transform .15s, box-shadow .15s;
    white-space: nowrap;
  }
  #btn-start:hover { transform: scale(1.05); box-shadow: 0 10px 26px rgba(34,197,94,.28); }
  #btn-start:active { transform: scale(.97); }

  .btn-action-group {
    display: flex;
    gap: 10px;
    margin-top: 8px;
    width: 75%;
  }

  .btn-action {
    flex: 1;
    padding: 9px 8px;
    background: linear-gradient(135deg, #7dd3fc, #86efac);
    border: none;
    border-radius: 10px;
    color: #134e2d;
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    cursor: pointer;
    letter-spacing: 0.3px;
    box-shadow: 0 6px 16px rgba(56,189,248,.2);
    transition: transform .15s, box-shadow .15s;
    white-space: nowrap;
  }
  .btn-action:hover { transform: scale(1.05); box-shadow: 0 8px 20px rgba(34,197,94,.25); }
  .btn-action:active { transform: scale(.97); }

  /* Upcycle Result */
  #upcycle-container {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: auto;
    min-height: 0;
    background: linear-gradient(to top, rgba(34,197,94,.15), rgba(34,197,94,.05));
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    z-index: 150;
    padding: 0 6px 6px 6px;
    border-top: 1px solid var(--border);
    border-radius: 0 0 16px 16px;
    max-height: 58%;
    overflow-y: auto;
  }

  #upcycle-middle {
    width: 100%;
    margin-bottom: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  #upcycle-container.show { display: flex; }

  #upcycle-title {
    font-family: 'Press Start 2P', monospace;
    font-size: 7px;
    color: var(--dim);
    text-align: center;
    letter-spacing: 1px;
    margin-bottom: 4px;
  }

  .btn-craft-main {
    width: 100%;
    font-size: 11.2px;
    padding: 6px 6px;
    letter-spacing: 0.2px;
    margin: 0;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .btn-craft-main:hover {
    transform: translateY(-1px);
    box-shadow: 0 8px 16px rgba(34,197,94,.18);
  }

  .btn-craft-main:active {
    transform: translateY(0);
  }

  #craft-section {
    width: 100%;
    background: rgba(255,255,255,.72);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 6px;
    display: none;
  }

  #craft-section.show {
    display: block;
  }

  .craft-rate {
    font-family: 'IBM Plex Mono', 'Courier New', monospace;
    font-size: 10px;
    font-weight: 700;
    text-align: center;
    color: #2f6e4f;
    margin-bottom: 6px;
  }

  #craft-buttons {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 6px;
  }

  .craft-btn {
    border: 1px solid #9fd5b1;
    border-radius: 8px;
    padding: 6px 5px;
    background: linear-gradient(135deg, #ffffff, #e8fff1);
    color: #1d4e36;
    text-align: left;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-height: 60px;
    transition: transform .15s, box-shadow .15s;
  }

  .craft-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 14px rgba(34,197,94,.16);
  }

  .craft-btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
    box-shadow: none;
    transform: none;
  }

  .craft-name {
    font-size: 10px;
    font-weight: 800;
    line-height: 1.2;
  }

  .craft-need,
  .craft-reward {
    font-size: 8px;
    line-height: 1.2;
  }

  .craft-reward {
    color: #117a42;
    font-weight: 700;
  }

  .craft-result {
    min-height: 18px;
    margin-top: 7px;
    font-size: 10px;
    font-weight: 700;
    text-align: center;
  }

  .craft-result.success { color: #0f9d58; }
  .craft-result.fail { color: #d63031; }

  #craft-status-top {
    position: absolute;
    left: 10px;
    right: 10px;
    bottom: 6px;
    min-height: 20px;
    margin: 0;
    font-size: 11px;
    font-weight: 700;
    text-align: center;
    color: #2f6e4f;
    pointer-events: none;
  }

  #craft-status-top.success { color: #0f9d58; }
  #craft-status-top.fail { color: #d63031; }

  /* Responsive */
  @media (max-width: 600px) {
    #craft-buttons {
      grid-template-columns: 1fr;
    }
  }

  @media (max-width: 400px) {
    #upcycle-container {
      padding: 4px 2px 2px 2px;
    }

    .craft-btn {
      min-height: 56px;
    }
  }

  /* ===== COMBO BADGE ===== */
  #combo-badge {
    position: absolute;
    top: 14px; right: 14px;
    font-family: 'IBM Plex Mono', 'Courier New', monospace;
    font-size: 10px;
    font-weight: 700;
    background: var(--yellow);
    color: #000;
    padding: 6px 10px;
    border-radius: 6px;
    z-index: 40;
    display: none;
    box-shadow: 0 0 12px var(--yellow);
    letter-spacing: 1px;
  }
  .trash.trap-item {
    animation: trap-pulse 0.6s ease-in-out infinite alternate !important;
  }
  @keyframes trap-pulse {
    from { transform: rotate(-8deg) scale(1);   box-shadow: 0 0 12px rgba(255,109,0,.7); }
    to   { transform: rotate(8deg)  scale(1.1); box-shadow: 0 0 24px rgba(255,50,0,1);  }
  }

  #game-area { transition: transform .08s; }

  /* ===== STATS inside side panel ===== */
  #stats-bar {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 12px 10px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 10px 25px rgba(34,197,94,.08);
    backdrop-filter: blur(8px);
  }

  .stats-title {
    font-family: 'Press Start 2P', monospace;
    font-size: 7px;
    color: var(--dim);
    letter-spacing: 2px;
    margin-bottom: 10px;
    text-transform: uppercase;
  }

  #stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 5px;
    flex: 1;
  }

  .stat-cell {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    background: rgba(255,255,255,.72);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 4px;
    transition: border-color .3s, background .3s;
  }

  .stat-image-wrap {
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .stat-image {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .stat-cell.has-catch {
    border-color: rgba(255,255,255,.18);
    background: rgba(255,255,255,.07);
  }

  .stat-cell .stat-label { font-size: 8px; color: #4d6b5a; text-align: center; line-height: 1.2; }
  .stat-cell .stat-count {
    font-family: 'IBM Plex Mono', 'Courier New', monospace;
    font-size: 11px;
    color: #1f3b2d;
    font-weight: 700;
    text-shadow: 0 1px 0 rgba(255,255,255,.55);
    min-height: 12px;
    letter-spacing: 1px;
  }
  .stat-cell.trap-cell .stat-count { color: #d62839; }

  @keyframes stat-bump {
    0%   { transform: scale(1); }
    40%  { transform: scale(1.35); }
    100% { transform: scale(1); }
  }
  .stat-bump { animation: stat-bump .25s ease-out; }

  .home-btn {
    position: fixed;
    top: 12px;
    right: 14px;
    z-index: 1000;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: linear-gradient(135deg, #ffffff, #dcfce7);
    color: var(--text);
    font-size: 0.95rem;
    font-weight: 700;
    padding: 8px 14px;
    box-shadow: 0 6px 16px rgba(34,197,94,0.12);
    cursor: pointer;
  }

  .home-btn:hover { transform: translateY(-1px); }
</style>
</head>
<body>

<button class="home-btn" onclick="goHome()">🏠 Home</button>
<div id="wrapper">

  <!-- Side panel -->
  <div id="side-panel">

    <div class="panel-box">
      <div class="panel-title">เวลา</div>
      <div id="timer-value">60</div>
      <div id="timer-bar-wrap"><div id="timer-bar"></div></div>
    </div>

    <div class="panel-box">
      <div class="panel-title">คะแนน</div>
      <div id="score-value">0</div>
      <div id="score-delta"></div>
    </div>

    <div class="panel-box">
      <div class="panel-title">สีถัง</div>
      <div id="bin-color-indicator">
        <!-- Current color -->
        <div class="bin-color-slot current">
          <div class="bin-color-content">
            <div id="bin-swatch"></div>
            <div class="bin-color-info">
              <div id="bin-color-name">—</div>
              <div id="bin-color-countdown"></div>
            </div>
          </div>
        </div>
        <!-- Next color (overlay in bottom-right) -->
        <div class="bin-color-slot next">
          <div class="bin-color-next-label">next</div>
          <div class="bin-color-content">
            <div id="bin-swatch-next"></div>
            <div id="bin-color-name-next">—</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Stats moved here -->
    <div id="stats-bar">
      <div class="stats-title">📊 ขยะที่เก็บได้</div>
      <div id="stats-grid"></div>
    </div>

  </div>

  <!-- Game area only -->
  <div id="game-area">
    <div id="ground-line"></div>
    <div id="combo-badge">COMBO x<span id="combo-num">0</span></div>
    <div id="bin-wrap">
      <svg id="bin-svg" viewBox="0 0 64 80" xmlns="http://www.w3.org/2000/svg">
        <rect id="bin-lid" x="6" y="4" width="52" height="10" rx="5" fill="white"/>
        <rect x="26" y="0" width="12" height="8" rx="4" fill="white" id="bin-handle"/>
        <rect id="bin-body" x="8" y="16" width="48" height="58" rx="8" fill="white"/>
        <rect x="20" y="22" width="5" height="46" rx="2" fill="rgba(0,0,0,.12)" id="stripe1"/>
        <rect x="30" y="22" width="5" height="46" rx="2" fill="rgba(0,0,0,.12)" id="stripe2"/>
        <rect x="40" y="22" width="5" height="46" rx="2" fill="rgba(0,0,0,.12)" id="stripe3"/>
        <rect x="11" y="19" width="6" height="30" rx="3" fill="rgba(255,255,255,.35)"/>
      </svg>
    </div>
    <div id="overlay">
      <h1>♻️ เก็บขยะ!</h1>
      <div class="sub">ขยับถังซ้าย-ขวา<br>เพื่อรับขยะที่ตรงสี<br>⚠️ หลีกเลี่ยง 🔥💣 กับดัก!</div>
